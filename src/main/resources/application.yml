spring:
  application:
    name: doc-ai
  profiles:
    default: anthropic
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
      # Uploads are never persisted (SPEC §5). Spring Boot's default threshold of 0 bytes makes
      # Tomcat write every part to java.io.tmpdir before the handler ever sees it; at or above
      # max-file-size no accepted upload can reach the disk.
      file-size-threshold: 20MB
  ai:
    model:
      embedding: none
  # Resource server per SPEC §7. Empty by default so the 'local' profile needs no tenant; any
  # other profile fails at startup with the name of the missing property.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${DOCAI_JWT_ISSUER_URI:}
          audiences: ${DOCAI_JWT_AUDIENCE:}

docai:
  intake:
    render-dpi: 150
    max-image-edge: 1600
    max-pages: 5
  ai:
    timeout: 60s
    retries-on-mapping-error: 1
  validation:
    max-days-in-past: 90
    max-days-in-future: 14
    max-krankenstand-days: 60
  # The app role of SPEC §7. Issuer and audience are Spring's own keys, under spring.security.
  security:
    required-role: DocAi.Process

logging:
  level:
    # Spring AI's BeanOutputConverter logs the model's raw answer at ERROR when it cannot be
    # mapped onto the record. That text is document content - names, SVNR, addresses - and must
    # never be logged (CLAUDE.md hard rules), so this one logger stays silent. The mapping
    # failure itself is reported by SpringAiDocumentAiClient without the model output.
    org.springframework.ai.converter.BeanOutputConverter: "OFF"

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true

# SPEC §10. Only /actuator/health is public (SPEC §7), so the schema and the UI need a token
# in every profile but 'local' - which is the profile they are meant for.
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: anthropic
  ai:
    model:
      chat: anthropic
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-sonnet-5
          max-tokens: 4096
          # No temperature here, and none is inherited either: the model answers 400
          # "`temperature` is deprecated for this model". Spring AI defaults the option to 0.8
          # whether or not it is configured, so AnthropicSamplingConfig clears it after binding.
          # Deviation from SPEC 2 ("Temperature 0."), which predates the current models.

---
spring:
  config:
    activate:
      on-profile: ollama
  ai:
    model:
      chat: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
      chat:
        options:
          # SPEC 8 gives the local profile a budget rather than a name - about 5 GB resident
          # beside the num-ctx below - and names this model as the default meeting it. The
          # measurements behind that, on an RTX 4050 (6 GB) with 15 GB of system RAM:
          #   qwen2.5vl:7b  refuses to load at any context - "requires more system memory
          #                 (11.6 GiB) than is available"; the weights and vision projector,
          #                 not the KV cache, so a smaller context does not help
          #   qwen2.5vl:3b  loads, but allocates ~10 GB and lands 100% on the CPU, and took
          #                 the Ollama server down when given an image
          #   llava         runs 32% on the CPU, 35 s per page, and misses the document type
          #   gemma3:4b     4.6 GB, 100% GPU, 4.5 s per page, reads type and date
          # Anything larger than ~5 GB resident will not fit beside the 16384 context.
          model: gemma3:4b
          num-ctx: 16384
          temperature: 0.0

---
spring:
  config:
    activate:
      on-profile: eval
  main:
    # SPEC §12: a batch run over eval/input, not a service. No port is opened, so the eval
    # profile needs no security settings either.
    web-application-type: none

docai:
  eval:
    input: eval/input
    output: eval/output
    expected: eval/expected

---
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  swagger-ui:
    # SPEC §10: the UI is a development aid and is not served in production. The schema at
    # /v3/api-docs stays available behind a token, so a client generator still works.
    enabled: false
