spring:
  application:
    name: doc-ai
  profiles:
    default: anthropic
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
      # Uploads are never persisted (SPEC §5). Spring Boot's default threshold of 0 bytes makes
      # Tomcat write every part to java.io.tmpdir before the handler ever sees it; at or above
      # max-file-size no accepted upload can reach the disk.
      file-size-threshold: 20MB
  ai:
    model:
      embedding: none

docai:
  intake:
    render-dpi: 150
    max-image-edge: 1600
    max-pages: 5
  ai:
    timeout: 60s
    retries-on-mapping-error: 1
  validation:
    max-days-in-past: 90
    max-days-in-future: 14
    max-krankenstand-days: 60

logging:
  level:
    # Spring AI's BeanOutputConverter logs the model's raw answer at ERROR when it cannot be
    # mapped onto the record. That text is document content - names, SVNR, addresses - and must
    # never be logged (CLAUDE.md hard rules), so this one logger stays silent. The mapping
    # failure itself is reported by SpringAiDocumentAiClient without the model output.
    org.springframework.ai.converter.BeanOutputConverter: "OFF"

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: anthropic
  ai:
    model:
      chat: anthropic
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-sonnet-5
          max-tokens: 4096
          temperature: 0.0

---
spring:
  config:
    activate:
      on-profile: ollama
  ai:
    model:
      chat: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
      chat:
        options:
          model: qwen2.5vl:7b
          num-ctx: 16384
          temperature: 0.0
