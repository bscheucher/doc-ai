# Applies to every test: pick an explicit profile so the anthropic / ollama
# documents in application.yml are not activated by spring.profiles.default.
spring.profiles.active=test
# The secured chain of SPEC §7 applies to every test that does not activate 'local'.
# Tokens are built by spring-security-test, so nothing is ever fetched from this issuer.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/test-tenant/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=api://doc-ai-test
